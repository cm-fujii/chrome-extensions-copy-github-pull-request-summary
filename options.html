<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <title>Copy GitHub Pull Request Summary</title>
    <style>
      body {
        margin: 0;
        padding: 12px 16px;
        min-width: 360px;
        font: 13px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        color: #1f2328;
      }
      label {
        display: flex;
        gap: 8px;
        align-items: flex-start;
        cursor: pointer;
      }
      input {
        margin: 3px 0 0;
      }
      small {
        display: block;
        color: #59636e;
      }
    </style>
  </head>
  <body>
    <label>
      <input type="checkbox" id="removeImages" />
      <span>
        Description 内の画像 URL を削除する
        <small>画像は「（画像: alt）」に置き換え、画像だけを包むリンクも外します</small>
      </span>
    </label>
    <script src="options.js"></script>
  </body>
</html>
